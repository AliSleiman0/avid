name: "Epic"
description: "A WBS 2nd-level grouping of issues. Not a unit of work itself."
title: "Epic X.Y — <name>"
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: |
        An epic groups Ready-able issues. Three levels only: **Epic → Issue → Task
        (checkbox)**. The epic itself is never worked directly.
  - type: input
    id: wbs
    attributes:
      label: WBS id
      placeholder: "1.4"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this epic delivers, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Issues
      description: Task-list of child issues (rolls up progress).
      value: |
        - [ ] #
        - [ ] #
    validations:
      required: true
