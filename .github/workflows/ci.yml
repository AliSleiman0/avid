name: CI

# AVID-4: every DoD gate, machine-checked, on push to main and every PR. Runs on
# Linux (the Pi target is Linux; ADR-008). The matrix exercises BOTH 3.11 (the Pi's
# system Python) and 3.13 (dev) — bug #27 shipped because the 3.11 leg, though
# documented, was never actually run.
#
# This file was cut for cost on 2026-08-18 under a GitHub Actions billing ceiling, but
# NOT by dropping `pull_request:` — a PR that merges unverified breaks CONTRIBUTING's
# "CI green" clause, and #324 already paid for merging on an unproven branch. The
# minutes come back from two places that cost no signal:
#
#   1. The numpy cap in `pyproject.toml` is now marker-conditional. It was leaking into
#      the `memory` extra, and 1.26.4 has no cp313 wheel, so `test (3.13)` and
#      `async-debug` each COMPILED NUMPY FROM SOURCE — 5m02s apiece, ~10 of the 13
#      billable minutes per run. That is the bulk of the saving.
#   2. Docs-only changes are skipped: three consecutive Markdown-only PRs each burned
#      the full matrix in August. Nothing under `paths-ignore` can change a test outcome.
#
# ⚠️ `paths-ignore` means a docs-only PR shows NO checks rather than green ones. That is
# a skip, not a pass — do not read an empty check list as verification.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch: # so a branch can still be verified on demand

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, lint, types, architecture, and the P3/P7 purity greps. Single
  # interpreter — these are source-level checks, not runtime behaviour.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --dev --frozen
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy avid
      - name: import-linter (P1/P5)
        run: uv run lint-imports
      - name: P3 — composition-root purity
        # No Real*/Fake* adapter is constructed outside main.py and adapters/. A match
        # here means an adapter leaked into the domain/core/services layers.
        # The prefix must be followed by an uppercase letter (the RealClock/FakeSpeaker
        # CamelCase convention) so a genuinely-named port like `RealtimeClient` — "Real"
        # + lowercase "time", not a Real* adapter — is not a false positive.
        run: |
          if grep -rEn --include='*.py' '\b(Real|Fake)[A-Z][A-Za-z0-9_]*\(' avid/domain avid/core avid/services; then
            echo "::error::P3 violation — Real*/Fake* constructed outside main.py / adapters/"
            exit 1
          fi
      - name: P7 — config purity
        # Config is injected, never read: no os.environ / os.getenv anywhere in
        # avid/ except core/config.py.
        run: |
          if grep -rEn --include='*.py' 'os\.(environ|getenv)' avid | grep -v 'avid/core/config.py'; then
            echo "::error::P7 violation — os.environ/os.getenv outside core/config.py"
            exit 1
          fi

  # The suite on both interpreters, with the ≥90% non-adapter coverage gate
  # (fail_under lives in pyproject [tool.coverage.report]).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
        # `--extra memory` installs numpy (the §8.5 index): a pure, platform-independent wheel,
        # so the hybrid-retrieval matmul (#120) is actually exercised on both interpreters.
      - run: uv sync --dev --frozen --extra memory --python ${{ matrix.python-version }}
      - name: pytest + coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov
      - name: upload FakeDisplay frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-py${{ matrix.python-version }}
          path: .artifacts/frames/
          if-no-files-found: ignore

  # P8: the suite under asyncio debug. tests/conftest.py arms on PYTHONASYNCIODEBUG
  # and fails the run on any slow-callback warning > 50 ms (blocking I/O on the loop).
  async-debug:
    runs-on: ubuntu-latest
    env:
      PYTHONASYNCIODEBUG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
        # `--extra memory` (numpy): the retrieval suite must run here too, so the inline matmul
        # is proven to stay off the loop under the 50 ms slow-callback gate (#120, P8).
      - run: uv sync --dev --frozen --extra memory
      - name: pytest under asyncio debug (slow-callback > 50 ms fails)
        run: uv run pytest
