# config/pi.toml — the Raspberry Pi profile at M1 (SDS §3.11.1, §9.6).
#
# The same binary as config/sim.toml; only a few strings differ (§9.6). At M1 the Pi
# "boots to app": systemd starts it, it reaches IDLE, a watchdog restarts it if it
# wedges. The device adapters are still all-fake — real camera/servo/audio/display land
# with their hardware issues at M2+ — so the ONLY differences from sim here are the two
# that make it a supervised process: notifier = "systemd" and the [systemd] watchdog.
#
# The secret is NOT here — OPENAI_API_KEY is read from the environment, once, at the
# composition root. $NOTIFY_SOCKET is likewise injected by systemd at runtime (§3.11.3).

[adapters]                      # ← the entire sim/real switch (§3.9.2, §3.11.1)
camera     = "fake"             # real picamera2 lands at M2 (SPK-5 / AVID-43)
servo      = "fake"
display    = "fake"
microphone = "fake"
speaker    = "fake"
vad        = "fake"             # real silero flips on with mic/speaker at the M4 gate (AVID-91)
face_detector = "fake"  # real yunet flips on at the M8 gate (#226)
realtime   = "replay"           # replay recorded sessions — no OpenAI connection
notifier   = "systemd"          # ← sd_notify to $NOTIFY_SOCKET (§3.11.3, AVID-38)

[display]
# The real framebuffer adapter lands with this milestone; display stays "fake" above until
# the on-Pi contract run flips it (AVID-57), exactly as camera/servo/mic/speaker did. On the
# bring-up rig the Elecrow 3.5" SPI ILI9486 (piscreen,drm overlay) surfaces as /dev/fb0 —
# NOT fb1: this Pi is headless, so the SPI panel grabbed framebuffer index 0. It is 32bpp
# XRGB8888. The `robot` nologin user is already in `video` (SupplementaryGroups from AVID-51),
# so it can open /dev/fb0 under the read-only unit. Set `device` when flipping to framebuffer.
device     = "/dev/fb0"         # framebuffer path — only the framebuffer adapter uses it
width      = 480                # panel width  (§2.4) — both adapters report it as resolution
height     = 320                # panel height (§2.4)
# The code tree is read-only under the unit's ProtectSystem=strict, so the fake display's PNGs
# go to the service's writable StateDirectory (/var/lib/robot), not the repo-relative default.
# Injected, never reached for (P7). See deploy/robot.service.
frames_dir = "/var/lib/robot/frames"

[ai]
# PINNED to a dated snapshot (§6.10 volatility). FLAGSHIP, not mini, and the reason is LATENCY
# rather than §6.10.5's quality trigger. Measured on this Pi, 2026-08-01, 6 trials each,
# `tools/probe_first_token.py` — model time-to-first-token (response.created -> first audio delta):
#
#   gpt-realtime-mini-2025-12-15   min 430  median 530  max  710
#   gpt-realtime-2025-08-28        min 214  median 328  max  424   <- this one
#   gpt-realtime-2.1               min 306  median 416  max  572
#   gpt-realtime-2.1-mini          min 292  median 464  max 2039   <- unusable tail
#
# The flagship's WORST trial beats the mini's median, which is what O1's P95 is graded on. Costs
# 3.2x (§6.10.1 flagship rates) — projected ~$10/month against O7's $25, so the headroom pays for
# it. Revert to the mini line above if O7 ever tightens; it is a one-line change by design.
model             = "gpt-realtime-2025-08-28"
voice             = "cedar"
# The model that transcribes the USER. Realtime does not transcribe input unless asked;
# without it no conversation.user_transcribed is ever published (SDS §6.2.2). PINNED.
transcription_model = "whisper-1"
max_output_tokens = 512                                  # §6.10 guardrail
# §6.5. ⚠️ Resolved against the process WORKING DIRECTORY, not against this file. On the Pi
# that is WorkingDirectory=/opt/avid (robot.service) while this config lives at
# /etc/robot/config.toml — so a config-relative path would look under /etc/robot/ and find
# nothing. Same convention as [cues] dir and [realtime] session_dir: read-only assets
# shipped under the code tree stay repo-relative. Missing file = loud failure at load.
personality       = "config/personality/default.toml"

[ai.turn_detection]
# "none" since AVID-194: the SERVER's VAD is off and the local Silero gate is the single
# turn-taking authority. Two detectors over one microphone is a race, not redundancy — a
# 500-900 ms pause is ordinary speech, and the server used to commit inside it and answer a
# fragment. The three tuning values below are inert while type = "none"; they are kept so
# switching back to the two-authority behaviour for comparison stays a config edit.
type                = "none"
threshold           = 0.5
prefix_padding_ms   = 300
silence_duration_ms = 500

[realtime]                      # the Realtime session adapter (#102); only "replay" reads session_dir
# Committed under the read-only code tree (assets/sessions/, #101), readable under the unit's
# ProtectSystem=strict — so repo-relative, like [cues] dir. The openai adapter (#105) ignores it.
session_dir = "assets/sessions/two_turn"

[gate]                          # local VAD gate — §6.3 / ADR-007 (NOT [ai.turn_detection], the server VAD)
vad_model            = "silero_v5"
threshold            = 0.5       # Silero speech-probability cutoff
ring_buffer_ms       = 300       # pre-roll replayed at a turn's start
silence_hold_ms      = 900       # silence run before a turn is declared over (debounce).
# MUST clear [ai.turn_detection] silence_duration_ms by >= 200 ms, asserted in Config: the mic
# stream stops exactly here, so without a gap the server VAD is still counting when the audio
# ends and the turn never commits. Measured 2026-08-01 -- 500/500: 2 replies in 13 turns;
# 900/900: 1 in 8; 900/500: 10 in 14. Equal is fatal in both directions (AVID-176).
session_idle_close_s = 30
# The echo gate (§6.2.4). The uplink is shut while the robot speaks; a rising edge inside that
# window is the USER only if it clears the running echo floor by this margin. Very large = full
# half-duplex (barge-in off), the documented fallback if the levels ever stop separating.
#
# MEASURED, no longer provisional (#106 AC-3, 2026-08-01). Pi + USB PnP mic + MAX98357A at 95%,
# conversational volume at ~50 cm, ambient rms -35.2 dBFS:
#
#     margin   suppressed frames per reply        verdict
#     6.0      67, 52 / 22, 16, 61, 7, 37, 6      user speech gated out mid-interruption
#     3.0      0, 0, 0, 0, 0, 8                   admitted cleanly, no self-interruption
#
# The one suppressing episode at 3.0 is the gate working: its loudest rejected frame was
# -10.3 dBFS against a -14.3 floor, 4.2 dB up and correctly read as echo. At 6.0 the same rig
# rejected frames peaking at -7.0 dBFS that were genuinely the user. So the two populations DO
# separate and this sits between them -- the first of the three documented outcomes, which is
# why #163 (AEC) is desirable but not required for AC-3.
#
# ⚠️ One run per value, and nothing between 3 and 6 has been tried, so this is the best-supported
# number rather than a proven optimum. ⚠️ Every figure recorded before 2026-08-01 said "6.0"
# whatever this file held -- the bench harness never passed it (#180).
# ⚠️ UNCALIBRATED (AVID-296). Tuned on 2026-08-15 with the capture mixer's `Auto Gain Control`
# in an UNKNOWN state — and AGC moves this rig's empty-room floor by ~20 dB (-36 -> -17 dBFS).
# A margin measured at one gain is not valid at another, so treat this number as provisional
# until it is re-derived with AGC provisioned off and a person actually speaking. It is left at
# the shipped value rather than guessed at: a guess would be indistinguishable from calibration.
barge_in_margin_db   = 3.0
# ⚠️ 150 -> 250 (#467). The tail is armed at `end_response`, which fires when the last delta is
# handed to the speaker -- NOT when the room goes quiet. `Speaker.play()` counts frames the device
# ACCEPTED into its ring, so ~107 ms of the reply (2560 frames at 24 kHz) is still being clocked
# out when the tail starts counting. At 150 ms that left ~43 ms of real slack and the end of the
# robot's own voice went up the uplink as user audio. Now asserted against `[speaker] sample_rate`
# by Config, which computes the depth rather than trusting this comment.
echo_tail_ms         = 250       # uplink stays shut this long after a reply ends (DAC drain)
# How long after a reply a NEW turn origin is still judged against the echo floor (#467).
#
# ⚠️ A DIFFERENT JOB from echo_tail_ms, and fusing the two is what let the robot answer itself for
# eight minutes on 2026-08-24. The tail is about STREAMING (do not send the DAC's drain to the
# model); the guard is about ORIGINS (do not let the room's ringing start a turn). The rig
# re-triggered 370 ms after `playback_finished` -- 220 ms past the tail -- so nothing was
# consulted, the gate logged `0 suppressed`, and 26 self-triggered turns cost $0.50.
#
# ⚠️ UNCALIBRATED. 700 ms comfortably exceeds the one observed re-trigger; it is not a measurement.
# The decay is a property of the amp, the mic, the room and the geometry. Derive it the way
# barge_in_margin_db's table above was derived: 10 replies with nobody speaking, recording the
# loudest frame in the 2 s after `playback_finished` and how long it takes to fall below
# floor + margin; then set this to that time + 100 ms. ⚠️ If that population overlaps real speech
# at 1 m, STOP TUNING -- §6.2.4 says no margin can be tuned into working, and the honest answers
# are #163 (AEC) or full half-duplex (a very large margin, config only).
guard_window_ms      = 700
# The backstop (#467). ⚠️ A cap on turns that never proved they came from a human, NOT a cap on
# turns. The runaway ran at 3.25 turns/min; a fast human exchange here is 5-6/min -- it was
# SLOWER than a conversation, so no rate threshold separates them at any value. What separates
# them is the gap to the robot's own reply: 370 ms, against a person who must hear it end first.
# After this many back-to-back origins the guard stops expiring and every origin must clear the
# frozen floor until a quiet window passes. An owner at conversational distance clears it
# trivially and is never refused.
reactive_window_s        = 120.0
reactive_back_to_back_s  = 1.5
reactive_budget          = 4
capture_stall_s      = 5.0       # §10.5/#347 — mic silent this long = stalled, not ignored
# §6.9's escape hatch: no first audio delta this long after the falling edge -> DEGRADED (#171).
# MUST be < session_idle_close_s, asserted in Config — the idle close cancels this timer and
# drives no transition, so a longer value never fires and the robot wedges in THINKING.
think_timeout_s      = 10.0

[cues]                          # degraded-mode WAV cue bank (AVID-80); consumed by M5's ConversationService
# The clips are committed under the read-only code tree (assets/cues/, #88); readable under the
# unit's ProtectSystem=strict, so this stays repo-relative (unlike the writable frames/wav dirs).
dir = "assets/cues"

[memory]
db_path                = "/var/lib/robot/robot.db"   # on-device SQLite; local, never synced
embedder               = "local_minilm"   # WHICH real model -- NOT the fake-vs-real switch.
# ^ That switch is `[adapters] embedder`, which is absent from this file ON PURPOSE: this template
#   ships every device "fake" and selecting real hardware is a provisioning-time act
#   (deploy/PI_OPERATIONS.md S3). So this line does NOT mean the robot embeds with MiniLM -- with
#   `[adapters] embedder` unset it falls back to the schema default "fake" and this key is inert.
#   The two axes are documented at avid/core/config.py:83-85; they are named identically and sit in
#   one file, which is enough to misread and has been.
dimensions             = 384
top_k                  = 5
recency_half_life_days = 14.0                    # §7.7
# alpha/beta/gamma are Park et al.'s equal-weight baseline. delta (keyword) is #264's
# addition -- FTS5's proper-noun branch could not affect ranking at all before it, because
# with fewer live facts than the retriever's vector pool the candidate union is a no-op.
# MEASURED 2026-08-23 (#447): delta=1.0 made the REAL embedder score identically to the
# fake -- recall@5 0.66, paraphrase 0.20 -- because the keyword term decided the top-5 on
# its own. delta=0.5 gives 0.86 / 1.00. Not 0: the keyword term still earns its place
# (0.86 vs 0.84). tools/eval_recall.py --model-dir ./models --keyword <d> reproduces it.
weights = { recency = 1.0, importance = 1.0, relevance = 1.0, keyword = 0.5 }

[behavior]                      # §10.4
quiet_hours                = { start = "22:00", end = "07:30" }
timezone                   = "Asia/Beirut"
global_cooldown_s          = 900
daily_budget               = 5
presence_window_s          = 300
ambient_speech_threshold_s = 60
ignore_streak_limit        = 3
hold_open_s                = 30    # §10.7 step 5 / §10.5 — one number, two owners
ignore_backoff_multiplier  = 2     # §10.5 — cooldown_s *= this, per ignore
stale_grace_s              = 600   # §10.3 — how late a booking may still be worth saying

[vision]
fps = 3                         # §2.7.1: ≤1 core, and scale=1 does NOT fit a 200 ms period —
                                # 184 ms median / 247 ms max per capture+detect (#277). At 3 fps
                                # (333 ms) that is 55% median / 74% max. 4 fps peaks at 99%.
detector_scale = 1              # ⚠️ was 2, and at 2 the robot could not see anyone: 0 of ~75
                                # frames cleared even the adapter's 0.3 floor against a person
                                # framed at 93x116 px (#277). At 1: 84% of frames >= 0.6.
                                # NOT the decimation method — a box filter scored 0.054 vs
                                # subsampling's 0.053 on the same frames, so #221 still holds.
confidence_threshold = 0.35     # ⚠️ was 0.6, which lost a seated person 3x in 17 min (#279).
                                # Over a real working hour, at 0.6 only 32.6% of frames qualify
                                # and the longest gap while present is 116 s; at 0.35 it is 78.1%
                                # and 46.1 s. Empty-room rate is 0.07% vs 0.00% — detection
                                # separates occupied from empty ~600:1 at EVERY threshold, so a
                                # high bar costs true positives and buys almost nothing. Stays
                                # above the adapter's own 0.3 floor on purpose (§3.9.1).
                                # ⚠️ one hour, one person, one light — see #226 AC-8.
gain_window_s = 1.2             # 3-4 frames at 3 fps. Moves WITH fps: 0.6 s was 3-4 frames at
                                # 5 fps but only 1.8 at 3, below the anti-flap floor (#277).
lose_window_s = 75.0            # ⚠️ 62x the gain window ON PURPOSE. Someone who looks away or
                                # leans out of frame has not left the room; an early
                                # presence_lost naps the robot on a person sitting right there.
                                # The asymmetry was designed, the magnitude was guessed: 20 s
                                # produced exactly that failure 3x in 17 min (#279). 75 s is
                                # 1.63x the measured 46.1 s worst gap at threshold 0.35.
nap_after_s = 600.0             # §3.10.1's "+10 min" sustained absence -> SLEEPING (#224)

[motion]                        # MotionService's tuning (M9, §3.9.4). NOT the inventory —
# the axes live in [[servo.axes]] and are reported by Servo.axes (§3.9.3). The `axes` key
# that used to sit here was a second copy of that fact and was deleted by #200, not
# validated against: two copies of one fact is drift, and drift in config is silent.
idle_relax_ms       = 3000      # no buzz when idle (#203). A held SG90 hums and heats.
look_at_cooldown_ms = 4000      # min spacing between accepted look_at calls (#204). A
                                # safety property: it is what stops a model that finds
                                # gesturing delightful from driving the rail continuously.
# Idle micro-motion (#205) — the drift that makes a stationary object read as alive. The
# interval is a BAND, sampled irregularly: a perfectly periodic twitch reads as a
# mechanism, which is worse than stillness. Amplitude is a fraction of each axis's
# declared reach, so it means the same thing on a wide pan and a narrow tilt.
micro_motion_interval_min_s = 12.0
micro_motion_interval_max_s = 40.0
micro_motion_amplitude_frac = 0.03   # smaller than instinct suggests — a noticeable drift
                                     # is a tic; the goal is noticeable only by its absence.

[servo]                         # the servo rig for the servo adapter (AVID-52, ADR-009)
# ⚠️ R-04 (§9.2, SPK-4): the servos run on a SEPARATE 5-6 V rail, common ground only —
# never the Pi 5 V pin. A stall can brown out the Pi and corrupt the SD card, and the rig
# is now TWO servos whose worst case is both stalled at once (#206 measures it).
# servo stays "fake" above until /etc/robot/config.toml flips it on the machine.
#
# Shared electrical settings first — properties of the board and the servo model, identical
# on every channel. What is bolted where lives in the [[servo.axes]] tables below.
i2c_address  = 0x40             # PCA9685 default
min_pulse_us = 500              # SG90/MG90S pulse range (§4.7)
max_pulse_us = 2500
freq_hz      = 50
# ⚠️ The SG90/MG90S's own sweep across that pulse range — the SERVO's electrical span,
# NOT a linkage's safe reach below. It calibrates degree→pulse, so a value taken from an
# axis's max_deg makes every commanded angle wrong the moment a reach is narrowed —
# silently, because the fake ignores pulse widths and reports a perfect trace (#356).
actuation_deg = 180.0           # SG90/MG90S, §4.7

# The rig's inventory, and the ONLY copy of it (#200). Whatever is declared here is what
# Servo.axes reports and what the gesture planner negotiates against (§3.9.3) — [motion]
# used to carry a second list and nothing reconciled them, which is drift with a delay
# fuse: a stale one-axis copy means the robot never nods and nothing raises.
#
# ⚠️ min_deg/max_deg here are PROVISIONAL — conservative on purpose, pinned to each
# linkage's measured safe reach at #207's bring-up. 0-180 is the servo's electrical range,
# not the bracket's; committing it as if it were verified is how a servo drives the head
# into its own chassis.
[[servo.axes]]
name    = "pan"                 # body turn
channel = 0                     # verified on the rig 2026-07-21
min_deg = 30.0                  # provisional — #207
max_deg = 150.0                 # provisional — #207

[[servo.axes]]
name    = "tilt"                # head up/down — ADR-009's second axis; nod is a real nod
channel = 13                    # not a typo: where the second servo is already wired
min_deg = 60.0                  # provisional — #207. Tilt binds sooner than pan; a head
max_deg = 120.0                 # driven past its bracket is the failure this guards.

[microphone]                    # audio capture params for the microphone adapter (AVID-53)
# The real alsa adapter flips on with the mic HAL at the M4 gate (AVID-91); microphone stays
# "fake" above until then. device is the bring-up-verified USB PnP mic's ALSA name — NOT stock
# "default", which routes to the MAX98357 amp (avid-mic-hw-bringup). Folded here so the gate run
# is turnkey; inert while the adapter is "fake". Mixer: AGC OFF, Mic gain 10/16, `alsactl store`d.
device      = "plughw:CARD=Device,DEV=0"  # ALSA device — only the alsa adapter uses it
sample_rate = 16000             # 16 kHz — the Realtime/VAD input rate (§6.3)
channels    = 1                 # mono capture
chunk_ms    = 20                # frame size — the 20 ms mic-capture budget

[speaker]                       # audio playback params for the speaker adapter (AVID-54)
# The real alsa adapter lands with this milestone; speaker stays "fake" above until the on-Pi
# contract run flips it (AVID-57), exactly as camera/servo/mic did. device is the MAX98357 I2S
# DAC's ALSA name (e.g. "plughw:CARD=MAX98357A") — set it when flipping to alsa on the Pi.
device      = "default"         # ALSA device — only the alsa adapter uses it
# NOMINAL playback format — what the rig is tuned around, NOT a rate imposed on the audio.
# Every AudioChunk carries its own rate/channels and the adapter honours them, reopening the
# device when they differ (#91); a deviation from these is announced once at INFO.
sample_rate = 24000             # 24 kHz — the Realtime output rate (§6.2.4), NOT the mic's 16 kHz
channels    = 1                 # mono playback
# The code tree is read-only under the unit's ProtectSystem=strict, so the fake speaker's WAVs
# go to the service's writable StateDirectory (/var/lib/robot), like [display] frames_dir.
wav_dir     = "/var/lib/robot/speaker"

[api]
bind = "127.0.0.1"              # asserted loopback at load. §9.5.
port = 8787

[runtime]                       # §12.6 — O5's instrument (#379)
# How often the process stamps "still alive" into boot_log. This IS the precision of every
# downtime figure: a run that dies without warning is credited only to its last heartbeat, so
# uptime may be understated by up to one interval and never overstated. It is also the only
# timer-driven write in the system, so it is deliberately slow (~1,440 tiny updates/day)
# against §2.7.1's storage row. NOT the same thing as [systemd] watchdog_interval_s.
heartbeat_interval_s = 60.0

[systemd]                       # §3.11.3 — supervision knobs (AVID-38)
watchdog_interval_s = 15.0      # ping WATCHDOG=1 twice per WatchdogSec (unit: 30s)
