# config/pi.toml — the Raspberry Pi profile at M1 (SDS §3.11.1, §9.6).
#
# The same binary as config/sim.toml; only a few strings differ (§9.6). At M1 the Pi
# "boots to app": systemd starts it, it reaches IDLE, a watchdog restarts it if it
# wedges. The device adapters are still all-fake — real camera/servo/audio/display land
# with their hardware issues at M2+ — so the ONLY differences from sim here are the two
# that make it a supervised process: notifier = "systemd" and the [systemd] watchdog.
#
# The secret is NOT here — OPENAI_API_KEY is read from the environment, once, at the
# composition root. $NOTIFY_SOCKET is likewise injected by systemd at runtime (§3.11.3).

[adapters]                      # ← the entire sim/real switch (§3.9.2, §3.11.1)
camera     = "fake"             # real picamera2 lands at M2 (SPK-5 / AVID-43)
servo      = "fake"
display    = "fake"
microphone = "fake"
speaker    = "fake"
realtime   = "replay"           # replay recorded sessions — no OpenAI connection
notifier   = "systemd"          # ← sd_notify to $NOTIFY_SOCKET (§3.11.3, AVID-38)

[display]
# The real framebuffer adapter lands with this milestone; display stays "fake" above until
# the on-Pi contract run flips it (AVID-57), exactly as camera/servo/mic/speaker did. On the
# bring-up rig the Elecrow 3.5" SPI ILI9486 (piscreen,drm overlay) surfaces as /dev/fb0 —
# NOT fb1: this Pi is headless, so the SPI panel grabbed framebuffer index 0. It is 32bpp
# XRGB8888. The `robot` nologin user is already in `video` (SupplementaryGroups from AVID-51),
# so it can open /dev/fb0 under the read-only unit. Set `device` when flipping to framebuffer.
device     = "/dev/fb0"         # framebuffer path — only the framebuffer adapter uses it
width      = 480                # panel width  (§2.4) — both adapters report it as resolution
height     = 320                # panel height (§2.4)
# The code tree is read-only under the unit's ProtectSystem=strict, so the fake display's PNGs
# go to the service's writable StateDirectory (/var/lib/robot), not the repo-relative default.
# Injected, never reached for (P7). See deploy/robot.service.
frames_dir = "/var/lib/robot/frames"

[ai]
model             = "gpt-realtime-mini-2025-12-15"   # PINNED. §6.10.
voice             = "cedar"
max_output_tokens = 512                                  # §6.10 guardrail
personality       = "config/personality/default.toml"    # §6.5

[ai.turn_detection]
type                = "server_vad"
threshold           = 0.5
prefix_padding_ms   = 300
silence_duration_ms = 500

[gate]                          # §6.3 / ADR-007
vad_model            = "silero_v5"
ring_buffer_ms       = 300
session_idle_close_s = 30

[memory]
db_path                = "/var/lib/robot/robot.db"   # on-device SQLite; local, never synced
embedder               = "local_minilm"
dimensions             = 384
top_k                  = 5
recency_half_life_days = 14.0                    # §7.7
weights = { recency = 1.0, importance = 1.0, relevance = 1.0 }   # Park et al.

[behavior]                      # §10.4
quiet_hours                = { start = "22:00", end = "07:30" }
timezone                   = "Asia/Beirut"
global_cooldown_s          = 900
daily_budget               = 5
presence_window_s          = 300
ambient_speech_threshold_s = 60
ignore_streak_limit        = 3

[vision]
fps = 5                         # §2.7.1: ≤1 core

[motion]
axes = ["pan"]                  # ADR-009 — 1 or 2. Capability-negotiated (§3.9.3).

[servo]                         # physical channel for the servo adapter (AVID-52)
# ⚠️ R-04 (§9.2, SPK-4): the servo runs on a SEPARATE 5 V rail, common ground only —
# never the Pi 5 V pin. A stall can brown out the Pi and corrupt the SD card. The real
# pca9685 adapter lands with this milestone; servo stays "fake" above until the on-Pi
# contract run flips it (AVID-57), exactly as camera did.
channel      = 0                # PCA9685 channel
name         = "pan"            # axis name (reconciled with [motion] by M9)
min_deg      = 0.0              # safe reach — the adapter clamps to it (§3.9.1)
max_deg      = 180.0
i2c_address  = 0x40             # PCA9685 default
min_pulse_us = 500              # SG90/MG90S pulse range (§4.7)
max_pulse_us = 2500
freq_hz      = 50

[microphone]                    # audio capture params for the microphone adapter (AVID-53)
# The real alsa adapter lands with this milestone; microphone stays "fake" above until the
# on-Pi contract run flips it (AVID-57), exactly as camera/servo did. device is the ReSpeaker's
# ALSA name (e.g. "plughw:CARD=seeed2micvoicec") — set it when flipping to alsa on the Pi.
device      = "default"         # ALSA device — only the alsa adapter uses it
sample_rate = 16000             # 16 kHz — the Realtime/VAD input rate (§6.3)
channels    = 1                 # mono capture
chunk_ms    = 20                # frame size — the 20 ms mic-capture budget

[speaker]                       # audio playback params for the speaker adapter (AVID-54)
# The real alsa adapter lands with this milestone; speaker stays "fake" above until the on-Pi
# contract run flips it (AVID-57), exactly as camera/servo/mic did. device is the MAX98357 I2S
# DAC's ALSA name (e.g. "plughw:CARD=MAX98357A") — set it when flipping to alsa on the Pi.
device      = "default"         # ALSA device — only the alsa adapter uses it
sample_rate = 24000             # 24 kHz — the Realtime output rate (§6.2.4), NOT the mic's 16 kHz
channels    = 1                 # mono playback
# The code tree is read-only under the unit's ProtectSystem=strict, so the fake speaker's WAVs
# go to the service's writable StateDirectory (/var/lib/robot), like [display] frames_dir.
wav_dir     = "/var/lib/robot/speaker"

[api]
bind = "127.0.0.1"              # asserted loopback at load. §9.5.
port = 8787

[systemd]                       # §3.11.3 — supervision knobs (AVID-38)
watchdog_interval_s = 15.0      # ping WATCHDOG=1 twice per WatchdogSec (unit: 30s)
