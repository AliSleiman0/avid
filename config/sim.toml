# config/sim.toml — the development / simulator profile (SDS §3.11.1, §9.6).
#
# All-fake adapters, no hardware, no network, no API key required:
#   uv run avid --config config/sim.toml
# is a running robot on a laptop. The same binary reads config/pi.toml on the Pi;
# only the [adapters] strings differ (§9.6). The secret is NOT here — OPENAI_API_KEY
# is read from the environment, once, at the composition root.

[adapters]                      # ← the entire sim/real switch (§3.9.2, §3.11.1)
camera     = "fake"
servo      = "fake"
display    = "fake"
microphone = "fake"
speaker    = "fake"
vad        = "fake"             # scripted-timeline VAD simulator (silero is Pi-only, AVID-77)
realtime   = "replay"           # replay recorded sessions — no OpenAI connection

[ai]
model             = "gpt-realtime-mini-2025-12-15"   # PINNED. §6.10.
voice             = "cedar"
# The model that transcribes the USER. Realtime does not transcribe input unless asked;
# without it no conversation.user_transcribed is ever published (SDS §6.2.2). PINNED.
transcription_model = "whisper-1"
max_output_tokens = 512                                  # §6.10 guardrail
personality       = "config/personality/default.toml"    # §6.5

[ai.turn_detection]
type                = "server_vad"
threshold           = 0.5
prefix_padding_ms   = 300
silence_duration_ms = 500

[realtime]                      # the Realtime session adapter (#102); only "replay" reads session_dir
session_dir = "assets/sessions/two_turn"   # recorded session played back deterministically (#101)

[gate]                          # local VAD gate — §6.3 / ADR-007 (NOT [ai.turn_detection], the server VAD)
vad_model            = "silero_v5"
threshold            = 0.5       # Silero speech-probability cutoff
ring_buffer_ms       = 300       # pre-roll replayed at a turn's start
silence_hold_ms      = 500       # silence run before a turn is declared over (debounce)
session_idle_close_s = 30

[cues]                          # degraded-mode WAV cue bank (AVID-80); consumed by M5's ConversationService
dir = "assets/cues"             # committed 24 kHz mono clips (#88)

[memory]
db_path                = ".artifacts/sim.db"    # on-device SQLite; local, never synced
embedder               = "local_minilm"
dimensions             = 384
top_k                  = 5
recency_half_life_days = 14.0                    # §7.7
weights = { recency = 1.0, importance = 1.0, relevance = 1.0 }   # Park et al.

[behavior]                      # §10.4
quiet_hours                = { start = "22:00", end = "07:30" }
timezone                   = "Asia/Beirut"
global_cooldown_s          = 900
daily_budget               = 5
presence_window_s          = 300
ambient_speech_threshold_s = 60
ignore_streak_limit        = 3

[vision]
fps = 5                         # §2.7.1: ≤1 core

[motion]
axes = ["pan"]                  # ADR-009 — 1 or 2. Capability-negotiated (§3.9.3).

[display]                       # panel geometry + sinks for the display adapter (AVID-13/55)
frames_dir  = ".artifacts/frames"   # where FakeDisplay writes its eyeball-able PNGs (§3.9.2)
device      = "/dev/fb0"        # framebuffer path — only the framebuffer adapter uses it
width       = 480               # panel width  (§2.4) — both adapters report it as resolution
height      = 320               # panel height (§2.4)

[servo]                         # physical channel for the servo adapter (AVID-52)
channel      = 0                # PCA9685 channel
name         = "pan"            # axis name (reconciled with [motion] by M9)
min_deg      = 0.0              # safe reach — the adapter clamps to it (§3.9.1)
max_deg      = 180.0
i2c_address  = 0x40             # PCA9685 default; only the pca9685 adapter uses it
min_pulse_us = 500              # SG90/MG90S pulse range (§4.7)
max_pulse_us = 2500
freq_hz      = 50

[microphone]                    # audio capture params for the microphone adapter (AVID-53)
device      = "default"         # ALSA device — only the alsa adapter uses it (the fake synthesizes)
sample_rate = 16000             # 16 kHz — the Realtime/VAD input rate (§6.3)
channels    = 1                 # mono capture
chunk_ms    = 20                # frame size — the 20 ms mic-capture budget

[speaker]                       # audio playback params for the speaker adapter (AVID-54)
device      = "default"         # ALSA device — only the alsa adapter uses it (the fake writes WAVs)
# NOMINAL playback format — what the rig is tuned around, NOT a rate imposed on the audio.
# Every AudioChunk carries its own rate/channels and the adapter honours them (#91).
sample_rate = 24000             # 24 kHz — the Realtime output rate (§6.2.4), NOT the mic's 16 kHz
channels    = 1                 # mono playback
wav_dir     = ".artifacts/speaker"  # where FakeSpeaker writes its eyeball-able WAVs (§3.9.2)

[api]
bind = "127.0.0.1"              # asserted loopback at load. §9.5.
port = 8787
