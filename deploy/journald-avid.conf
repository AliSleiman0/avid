# journald: keep the logs OFF the robot's storage (SDS §3.12.2, AVID-381).
#
# Install to /etc/systemd/journald.conf.d/avid.conf — a drop-in, so the distro's
# own journald.conf stays untouched and this file is the only thing to reason about.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE EXISTS AT ALL
#
# SDS §3.12.2 has always said "journald with Storage=volatile and a memory cap",
# and deploy/README.md has always *said* logs go to journald and not the card.
# Nothing implemented it. The machine is not the repo (deploy/PI_OPERATIONS.md):
# a rule that lives only in prose is a rule that is not applied, and this project
# has already paid for that exact shape once — PI_OPERATIONS said "AGC off" while
# nothing checked, and an empty room read as 20% speech for weeks (#296/#283).
#
# ⚠️ AVID-382 moves the root filesystem to a USB SSD, which retires R-05's wear
# risk. This file is therefore NO LONGER a wear mitigation — it is a correctness
# one, and it stays for two reasons:
#
#   1. Thirty days of unbounded journal exhausts any disk, and disk exhaustion
#      during the M11 soak invalidates the run rather than merely annoying us.
#   2. If the SSD migration slips or is rolled back, this is the only thing
#      standing between the soak and R-05.
# ─────────────────────────────────────────────────────────────────────────────

[Journal]
# tmpfs, not /var/log/journal. Nothing survives a reboot — see the trade below.
Storage=volatile

# The cap that makes "volatile" safe. Without it journald will happily take 10%
# of RAM, which on a 4 GB Pi is 400 MB of memory the robot cannot use for a
# model. 64 MB holds days of this application's log volume.
RuntimeMaxUse=64M

# Keep individual files small so rotation is smooth rather than a single large
# reclaim while the robot is mid-turn.
RuntimeMaxFileSize=8M

# The robot is chatty at INFO by design (§3.12.2 — one grep on a correlation_id
# reconstructs a turn). Do NOT let journald silently drop bursts: a missing log
# line during a soak is indistinguishable from an event that never happened,
# which is the same "absent reads as zero" failure the metrics registry guards.
RateLimitIntervalSec=0
RateLimitBurst=0

# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS COSTS
#
# History does not survive a reboot. That is the deliberate trade: on a device
# whose storage is the binding constraint (§2.7.1), a month of retained logs is
# worth less than the write budget it spends. If history is wanted, §3.12.2's
# answer is to ship to a host over the network — not to turn this back on.
#
# ⚠️ Consequence for the M11 soak: a crash's last words are gone after the
# reboot that follows it. This is precisely why boot_log (#379) is in SQLite and
# not in the journal — the uptime record has to outlive the thing it records.
# ─────────────────────────────────────────────────────────────────────────────
