[project]
name = "avid"
version = "0.0.0"
description = "Pico — an AI Desktop Companion Robot."
readme = "README.md"
requires-python = ">=3.11"
# ADR-008: target is the Pi's system Python 3.11, so requires-python is >=3.11,
# NOT >=3.13. No 3.12+ syntax ships. Dev/CI run 3.13 (see .python-version); CI
# runs the suite on both 3.11 and 3.13 (AVID-4).
dependencies = [
    "pydantic>=2.7",
    # RFC 5545 recurrence, mandated by name in SDS §10.3 ("do not invent a schedule DSL").
    # ⚠️ This is the second runtime dependency, and the posture until M10 was pydantic alone.
    # It is a CORE dep rather than an extra behind one adapter -- the shape every other
    # third-party package here takes -- for one reason: P6 would then oblige a *fake* recurrence
    # resolver, which is a second, worse RRULE implementation grading itself against the first.
    # That is exactly the DSL §10.3 forbids. Pure Python, no C extension, so the Pi pays nothing.
    # The domain stays clean mechanically: `dateutil` is on import-linter's domain-purity list.
    "python-dateutil>=2.9",
]

[project.scripts]
avid = "avid.main:main"

[project.optional-dependencies]
# `picamera2` is NOT a pip dependency. On the Pi it comes from apt
# (python3-picamera2) and is picked up via `uv venv --system-site-packages`
# (ADR-008). It is imported only inside Picamera2Camera.
#
# `adafruit-circuitpython-servokit` drives the PCA9685 (AVID-52) and `pyalsaaudio` captures
# from the USB mic (AVID-53); `onnxruntime`+`numpy` run the Silero v5 VAD model (AVID-77) and the
# all-MiniLM-L6-v2 embedder (#119), and `tokenizers` is that embedder's WordPiece tokenizer. All
# ARE pip-installable and belong to this Pi-only extra (`uv sync --extra pi` on the Pi). Each is
# imported only inside its one adapter, lazily, so the modules load off-Pi where the extra is
# absent. (Silero/MiniLM are pure-CPU and would run off-Pi too, but their contract real legs are
# Pi-gated like the other HALs — SDS §14.4 — so the model blobs and these libs never ship to CI.)
#
# `numpy` is capped below 2.0 deliberately (AVID-57). The venv is built with
# `--system-site-packages` so `picamera2` resolves from apt, and the apt `simplejpeg` it
# imports is compiled against the numpy 1.x C ABI. A numpy 2.x wheel in the venv shadows
# the system 1.x and breaks that import with "numpy.dtype size changed, expected 96, got
# 88" — i.e. installing this extra silently kills the camera real leg. Lift the cap only
# once Raspberry Pi OS ships a numpy-2-built `simplejpeg`.
#
# ⚠️ The cap is MARKER-CONDITIONAL, and the marker is the whole point. uv resolves ONE numpy
# for the lockfile, so an unconditional `<2` here leaked into the `memory` extra that CI
# installs — and numpy 1.26.4 predates 3.13 and ships no cp313 wheel, so BOTH the `test (3.13)`
# and `async-debug` jobs COMPILED IT FROM SOURCE on every run: 5m02s each, ~10 of the 13
# billable minutes per CI run. The Pi is the only thing that needs the cap and it runs 3.11
# (ADR-008), so the cap is scoped to the interpreters that actually have the ABI problem.
# `PI_OPERATIONS.md` §2 predicted this exact failure and named this exact fix.
pi = [
    "adafruit-circuitpython-servokit>=1.3",
    "pyalsaaudio>=0.10",
    "onnxruntime>=1.16",
    "numpy>=1.24,<2; python_version < '3.12'",
    "numpy>=1.24; python_version >= '3.12'",
    "tokenizers>=0.20",
]
# The live OpenAI Realtime client (#105). `websockets` is the WSS transport
# (SDS §6.2.1, ADR-010); `openai` rounds out the vendor SDK per the issue's AC-2. Both are
# imported lazily, only inside OpenAIRealtimeClient, so avid/adapters/realtime.py loads on a host
# without this group (the replay fake + capture decorator never touch the vendor). Installed with
# `uv sync --extra openai` on a networked host; absent in CI, where the real leg is network-gated
# and skipped like the Pi HAL legs (SDS §14.4).
openai = [
    "openai>=1",
    "websockets>=13",
]
# The §8.5 in-memory vector index (#120). `numpy` runs the brute-force cosine matmul over the
# pre-normalised 384-dim vectors — lazy-imported only inside HybridRetriever (and the
# SileroVad path), so avid/adapters/retrieval.py loads on a host without this group. Unlike the
# `pi` extra, numpy is a pure, platform-independent wheel, so CI installs it (`--extra memory`)
# and actually exercises the ranking math. ADR-012 holds: numpy is an opt-in extra, never a
# default install, and never enters `domain/` (the domain-purity test enforces it).
#
# ⚠️ The floor is MARKER-CONDITIONAL and the 3.12+ branch is a *lower bound on purpose*, not
# tidiness. A bare `>=1.24` here is satisfied by 1.26.4 — the newest release under the `pi`
# extra's `<2` ABI cap — so uv, which resolves one numpy for the whole lockfile, picked it for
# every interpreter and never forked. 1.26.4 predates 3.13 and ships no cp313 wheel, so CI
# COMPILED NUMPY FROM SOURCE on every `test (3.13)` and `async-debug` job: 5m02s apiece, ~10 of
# 13 billable minutes per run. Requiring >=2.1 (the first release with cp313 wheels) on 3.12+
# is what forces the fork, so each interpreter gets a prebuilt wheel: ~3s instead of ~5m.
memory = [
    "numpy>=1.24; python_version < '3.12'",
    "numpy>=2.1; python_version >= '3.12'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    # Architecture enforcement (P1/P2/P5, AVID-3). Console entry point is
    # `lint-imports`; the contracts live in `.importlinter` at the repo root.
    "import-linter>=2",
    # Format/lint/types gates (AVID-2, run in CI by AVID-4). Minimal rule set
    # here; widen under AVID-2 if needed.
    "ruff>=0.6",
    "mypy>=1.11",
    # dateutil ships no inline types; without these mypy --strict sees Any and the resolver's
    # signature stops being checked at the one boundary where an off-by-a-timezone is silent.
    "types-python-dateutil>=2.9",
    # ⚠️ DEV ONLY, and deliberately not a runtime dep. Linux and the Pi carry a system tz
    # database; Windows does not, and without this wheel `zoneinfo.ZoneInfo("America/New_York")`
    # raises ZoneInfoNotFoundError -- so §10.3's DST tests would pass in CI and fail on a dev
    # box, which is the worst possible way for a test to behave.
    "tzdata>=2024.1",
]

[tool.pytest.ini_options]
# `async def test_*` run without a per-test decorator (AVID-9's bus tests).
asyncio_mode = "auto"
# AVID-50: the `hardware` mark tags the real-adapter half of a port contract. It runs
# only on the Pi (SDS §14.4) and is skipped off-hardware via tests/contract/_hardware.py's
# on_pi(). Registered here so `-m "not hardware"` / `-m hardware` are first-class and the
# mark raises no unknown-marker warning.
markers = [
    "hardware: the real-adapter half of a port contract; runs only on the Pi (SDS §14.4), skipped off-hardware via on_pi().",
    "p8_load: this test's own body IS the load — its coroutine is the stimulus, not the robot (#328). The P8 gate exempts slow callbacks attributed to a marked test's frame and prints them; everything the test then asserts stays fully gated. Apply deliberately, never to quiet a red.",
]

[tool.ruff]
# ADR-008: the Pi runs 3.11, so lint against 3.11 semantics (flags 3.12+ idioms).
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus the three that earn their keep: I (import
# order), and the two the docs call out — ASYNC (blocking-call detection, P8) and
# DTZ (naive-datetime, guards the Event envelope's wall-vs-monotonic rule).
# Deliberately NOT full `E`: E501 line length is the formatter's job (`ruff
# format`), which already governs code lines; enforcing it in lint would only
# flag long prose in comments/docstrings. Widen under AVID-2 if warranted.
extend-select = ["I", "ASYNC", "DTZ"]

[tool.mypy]
python_version = "3.11"
# Type-check against the deployment platform (ADR-008: the Pi runs Linux; CI is
# Linux-only). Pinning it keeps a dev on Windows/macOS honest — POSIX-only stdlib
# (e.g. socket.AF_UNIX, used by the systemd notifier) resolves the same as in CI,
# so no platform-specific `# type: ignore` drifts in or out between machines.
platform = "linux"
strict = true
files = ["avid"]

# picamera2/libcamera (AVID-51), adafruit_servokit (AVID-52), alsaaudio (AVID-53) and
# onnxruntime+numpy (AVID-77) are Pi-only (the `pi` extra), unstubbed *in the CI/mypy env where
# the extra is absent* (ADR-008, SPK-5). tokenizers (#119) is the same case — the MiniLM
# WordPiece tokenizer, lazy-imported only inside LocalMiniLmEmbedder. openai+websockets (#105) are the same case for the
# networked `openai` extra — imported lazily only inside OpenAIRealtimeClient (AC-6). Each is
# imported lazily only inside its one adapter; this override lets mypy resolve those imports as Any
# instead of erroring, without a per-line `# type: ignore`. numpy is here for the same reason the
# others are — it is not installed off-Pi, so mypy cannot find it — and vad.py already handles its
# arrays as Any regardless.
[[tool.mypy.overrides]]
module = [
    "picamera2.*",
    "libcamera.*",
    "adafruit_servokit.*",
    "alsaaudio.*",
    "onnxruntime.*",
    "numpy.*",
    "tokenizers.*",
    "openai.*",
    "websockets.*",
]
ignore_missing_imports = true

[tool.coverage.run]
# DoD is "≥90% non-adapter": adapters are proven by contract tests (P6), not by
# line coverage, so they are omitted from the gate (AVID-4).
source = ["avid"]
omit = ["avid/adapters/*"]

[tool.coverage.report]
# Fail the run below the DoD's 90% (AVID-4 makes the prose bar mechanical).
fail_under = 90
# Protocol/overload method bodies are never executed (they are `...`), so they
# read as uncovered and would sink pure-interface modules like core/ports.py
# below the DoD's 90%. Exclude bare `...` stubs and TYPE_CHECKING-only blocks
# (AVID-11).
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avid"]
