[project]
name = "avid"
version = "0.0.0"
description = "Pico — an AI Desktop Companion Robot."
readme = "README.md"
requires-python = ">=3.11"
# ADR-008: target is the Pi's system Python 3.11, so requires-python is >=3.11,
# NOT >=3.13. No 3.12+ syntax ships. Dev/CI run 3.13 (see .python-version); CI
# runs the suite on both 3.11 and 3.13 (AVID-4).
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
avid = "avid.main:main"

[project.optional-dependencies]
# `picamera2` is NOT a pip dependency. On the Pi it comes from apt
# (python3-picamera2) and is picked up via `uv venv --system-site-packages`
# (ADR-008). It is imported only inside RealPicamera2Camera. The concrete pip
# entry stays empty here so `uv lock` resolves on any platform; revisit at M2.
pi = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    # Architecture enforcement (P1/P2/P5, AVID-3). Console entry point is
    # `lint-imports`; the contracts live in `.importlinter` at the repo root.
    "import-linter>=2",
    # Format/lint/types gates (AVID-2, run in CI by AVID-4). Minimal rule set
    # here; widen under AVID-2 if needed.
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
# `async def test_*` run without a per-test decorator (AVID-9's bus tests).
asyncio_mode = "auto"
# AVID-50: the `hardware` mark tags the real-adapter half of a port contract. It runs
# only on the Pi (SDS §14.4) and is skipped off-hardware via tests/contract/_hardware.py's
# on_pi(). Registered here so `-m "not hardware"` / `-m hardware` are first-class and the
# mark raises no unknown-marker warning.
markers = [
    "hardware: the real-adapter half of a port contract; runs only on the Pi (SDS §14.4), skipped off-hardware via on_pi().",
]

[tool.ruff]
# ADR-008: the Pi runs 3.11, so lint against 3.11 semantics (flags 3.12+ idioms).
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus the three that earn their keep: I (import
# order), and the two the docs call out — ASYNC (blocking-call detection, P8) and
# DTZ (naive-datetime, guards the Event envelope's wall-vs-monotonic rule).
# Deliberately NOT full `E`: E501 line length is the formatter's job (`ruff
# format`), which already governs code lines; enforcing it in lint would only
# flag long prose in comments/docstrings. Widen under AVID-2 if warranted.
extend-select = ["I", "ASYNC", "DTZ"]

[tool.mypy]
python_version = "3.11"
# Type-check against the deployment platform (ADR-008: the Pi runs Linux; CI is
# Linux-only). Pinning it keeps a dev on Windows/macOS honest — POSIX-only stdlib
# (e.g. socket.AF_UNIX, used by the systemd notifier) resolves the same as in CI,
# so no platform-specific `# type: ignore` drifts in or out between machines.
platform = "linux"
strict = true
files = ["avid"]

[tool.coverage.run]
# DoD is "≥90% non-adapter": adapters are proven by contract tests (P6), not by
# line coverage, so they are omitted from the gate (AVID-4).
source = ["avid"]
omit = ["avid/adapters/*"]

[tool.coverage.report]
# Fail the run below the DoD's 90% (AVID-4 makes the prose bar mechanical).
fail_under = 90
# Protocol/overload method bodies are never executed (they are `...`), so they
# read as uncovered and would sink pure-interface modules like core/ports.py
# below the DoD's 90%. Exclude bare `...` stubs and TYPE_CHECKING-only blocks
# (AVID-11).
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avid"]
